name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests (no dependencies)
        run: python -m unittest -v
      - name: Self-check voiced example passes the gate
        run: python deslop.py --min-score 80 --quiet examples/voiced.md
